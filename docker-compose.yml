services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soccerpicks
      POSTGRES_USER: soccerpicks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://soccerpicks:${POSTGRES_PASSWORD}@db:5432/soccerpicks
      ODDS_API_KEY: ${ODDS_API_KEY}
    volumes:
      - video-data:/data/videos
    depends_on:
      - db
    restart: unless-stopped

  web:
    build: .
    ports:
      - "6060:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  video-data:
